# 공감 적산 Windows exe 빌드 (GitHub 무료 Windows 빌드 서버)
# - main/master에 올리거나 Actions 화면에서 'Run workflow'를 누르면 실행
# - 끝나면 실행 화면 아래 Artifacts에서 '공감적산-windows' zip을 내려받는다
# - v로 시작하는 태그(예: v0.5.0)를 올리면 Releases에 설치 파일이 자동으로 붙는다
name: Windows exe 빌드

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 러스트 준비
        uses: dtolnay/rust-toolchain@stable

      - name: 러스트 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: npm 설치
        run: npm ci

      - name: exe 빌드
        run: npm run build

      - name: 결과 모으기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/GonggamJeoksan.exe "out/GonggamJeoksan_단독실행.exe"
          Get-ChildItem out | Format-Table Name, Length
          Get-FileHash out/* -Algorithm SHA256 | Format-Table Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: 공감적산-windows
          path: desktop/out/*.exe
          retention-days: 30

      - name: 릴리스에 첨부(v 태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/out/*.exe
